<main class="page">
  <div class="home-grid">
    <section>
      <div class="intro">
        <div class="eyebrow">THE ZIPPO COLLECTION</div>
        <h1>{{introTitle}}</h1>
        <p class="muted">{{introDescription}}</p>
      </div>

      <label class="eyebrow" for="article-search">{{searchLabel}}</label>
      <input
        id="article-search"
        class="search"
        type="search"
        placeholder="{{searchPlaceholder}}"
        data-no-results="{{noResults}}"
        data-index-url="{{searchIndexUrl}}"
        data-search
      >
      <ul class="article-list" data-results>
        {{articleCards}}
      </ul>
      {{pagination}}
    </section>

    <aside class="side-note">
      <strong>Every ZIPPO has a story.<br>Explore the collection.</strong>
      <p class="muted">{{sideDescription}}</p>
    </aside>
  </div>
</main>
<script src="{{searchScriptUrl}}" defer></script>
